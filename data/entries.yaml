    repo: tashfeenahmed/freellmapi
    name: freellmapi
    status: listed
    tagline: OpenAI-compatible router that fails over across free LLM provider tiers
    summary: FreeLLMAPI exposes one /v1 endpoint (chat, responses, completions, embeddings, images, video, audio) and routes requests across free tiers from 34 providers, plus custom OpenAI-compatible endpoints. Provider keys are AES-256-GCM encrypted in SQLite, per-key RPM/RPD/TPM/TPD counters keep requests under quotas, and a 429 or 5xx triggers fallover to the next model. It also serves Anthropic Messages, Gemini and opt-in Ollama surfaces, and ships a React dashboard and desktop apps.
    categories:
      - gateways
    strengths:
      - Also speaks Anthropic, Gemini and Ollama formats, so Claude Code and Codex CLI connect
      - Per-key rate counters and automatic fallover on 429/5xx across providers
      - Keys AES-256-GCM encrypted in SQLite; apps only see one unified token
      - Runs on Node 20+ at about 40 MB idle RSS, or via Docker
    weaknesses:
      - Free installs get new models 30 days after premium; same-day catalog costs $19/yr
      - Single-user by design; no multi-user setup described
      - Depends on free tiers that providers can change or retire without notice
      - Catalog sync pulls a signed feed from freellmapi.co
