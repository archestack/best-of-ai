  - id: openshell
    repo: NVIDIA/OpenShell
    name: OpenShell
    status: listed
    tagline: Policy-enforced sandbox runtime for autonomous agents with credential brokering
    summary: Runs each agent in a sandbox with kernel-enforced limits on file access and system calls; every outbound connection passes a policy check, and agents never see real credentials, which a gateway injects only for approved endpoints. Policy changes are checked with formal verification before approval. Installs via a shell script on Linux, Apple Silicon macOS or WSL 2; Helm for Kubernetes; SDKs for Python, TypeScript, Go and Rust.
    categories:
      - sandboxes
    strengths:
      - Credentials attached by the gateway only to approved endpoints; sandboxes never hold them
      - Formal verification flags risky new access before a policy change is applied
      - Kubernetes deployment via Helm; GPU use inside sandboxes documented
      - Python, TypeScript, Go and Rust SDKs plus agent skills via npx skills add
    weaknesses:
      - Windows support is WSL 2 only and experimental
      - Default sandbox image is minimal Ubuntu with no agent; running one follows the docs walkthrough
      - Anonymous telemetry on by default; disable with OPENSHELL_TELEMETRY_ENABLED=false
      - Kubernetes installs require a CNI that enforces NetworkPolicy
