name: Add a project
description: Suggest a project for this list. We check it and reply here.
title: "Add: "
labels: [submission]
body:
  - type: input
    id: repo
    attributes:
      label: GitHub repository URL
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - assistants
        - chat-ui
        - desktop-apps
        - agent-platforms
        - automation
        - rag-knowledge
        - search
        - voice
        - image-video
        - security
        - agent-frameworks
        - memory
        - model-serving
        - models
        - training
        - ml-frameworks
        - gateways
        - observability
        - vector-db
        - sandboxes
        - data-tools
        - mcp-servers
        - learning
        - not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What does it do, or what do you get when you clone it?
      description: Concrete capability, not a slogan. The entry is written from the README anyway; this helps the reviewer.
    validations:
      required: true
  - type: input
    id: demo
    attributes:
      label: Live demo URL (optional)
  - type: dropdown
    id: relation
    attributes:
      label: Your relation to the project
      options:
        - maintainer
        - contributor
        - user
        - none
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: Its main job is AI: an app, a library, a model, infrastructure for AI apps, or learning material.
          required: true
        - label: It has an open-source license file.
          required: true
