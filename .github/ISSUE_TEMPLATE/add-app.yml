name: Add a project
description: Suggest a project for this list. A bot checks it and replies here.
title: "Add: "
labels: [submission]
body:
  - type: input
    id: repo
    attributes:
      label: GitHub repository URL
      placeholder: https://github.com/owner/name
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - assistants
        - chat-ui
        - agent-platforms
        - rag-knowledge
        - model-serving
        - gateways
        - memory
        - voice
        - image-video
        - coding
        - search
        - observability
        - vector-db
        - security
        - sandboxes
        - not sure
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What does it do, in one or two sentences?
      description: Concrete capability, not a slogan. The entry is written from the README anyway; this helps the reviewer.
    validations:
      required: true
  - type: input
    id: demo
    attributes:
      label: Live demo URL (optional)
  - type: dropdown
    id: relation
    attributes:
      label: Your relation to the project
      options:
        - maintainer
        - contributor
        - user
        - none
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: It has a Dockerfile, a compose file, or documented server install steps.
          required: true
        - label: It has an open-source license file.
          required: true
